name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议。请先说明**你想解决什么问题**，
        而不是直接描述实现方案 —— 有时候问题有更简单的解法。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有的 issue，没有重复
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到了什么问题
      description: 描述痛点，而不是方案
      placeholder: |
        每次给二三十张图加水印，都要一张张调参数，
        虽然批量功能能一次处理，但参数得反复试。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望怎么解决
      placeholder: 希望能把调好的参数一键存成预设，下次直接套用
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 有没有考虑过别的做法
      description: 如果你想过其它方案，说说为什么没选它们
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 只影响我自己
        - 应该对不少人有帮助
        - 是核心功能缺失
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充说明（可选）
    validations:
      required: false