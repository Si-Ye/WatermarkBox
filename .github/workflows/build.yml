name: Build

# 每次 push 到主分支或提 PR 时，编译并跑测试。
# 目的：把「代码能不能构建、测试过不过」变成可见的事实，
#       而不是依赖提交者的本地环境。
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

# 同一分支只保留最新一次运行，避免排队堆积
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译与测试
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 缓存依赖，后续构建会快很多
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 跑单元测试
        run: ./gradlew testDebugUnitTest --console=plain

      - name: 静态检查（Android Lint）
        # lint 检查代码质量与潜在 bug（未使用的资源、明显的空指针、
        # 权限缺失、布局问题等）。不通过则整个 CI 失败。
        #
        # ## 为什么不加 `|| true` 忽略失败
        #
        # 加了就等于没检查 —— 没人会去看「检查通过但有警告」的日志。
        # 既然加了这道关，就让它有约束力。
        #
        # ## 与 lint-baseline 的关系
        #
        # `app/lint-baseline.xml` 记录了**当前已存在的问题**，
        # 这些被豁免；只有**新增**的问题才会让 CI 失败。
        # 这样既能立刻启用，又不会因为历史欠账而卡住开发。
        #
        # 想查看全部问题（含基线里的）：本地跑 `./gradlew lintDebug` 看报告。
        run: ./gradlew lintDebug --console=plain

      - name: 编译 Debug 包
        run: ./gradlew assembleDebug --console=plain
      - name: 编译 Release 包（未签名，仅验证能构建）
        run: ./gradlew assembleRelease --console=plain

      # ## 为什么这里**不**做包完整性校验（踩坑记录）
      #
      # 起初在这加了 tools/check_apk_integrity.py，结果 CI 直接红。
      # 原因不是「环境坏了」，而是**未签名的 release 包本身就是残缺的**：
      # AGP 在没有签名配置时，不会把 AndroidManifest.xml / resources.arsc
      # 合进 APK。
      #
      # 而这条流水线本来就不产出可安装的包 —— 它只回答一个问题：
      # 「release 变体能不能编译通过」。产物完整性由 release.yml 把关
      # （那里有密钥、而且真的会发布出去的包必须是完整的）。


      - name: 上传 Lint 报告
        # 失败时最需要看报告，所以 always()
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          retention-days: 7

      - name: 上传测试报告
        # 无论测试是否失败都上传，方便排查
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          retention-days: 7

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
