name: Build

# 每次 push 到主分支或提 PR 时，编译并跑测试。
# 目的：把「代码能不能构建、测试过不过」变成可见的事实，
#       而不是依赖提交者的本地环境。
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

# 同一分支只保留最新一次运行，避免排队堆积
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译与测试
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 缓存依赖，后续构建会快很多
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 跑单元测试
        run: ./gradlew testDebugUnitTest --console=plain

      - name: 编译 Debug 包
        run: ./gradlew assembleDebug --console=plain

      - name: 编译 Release 包（未签名，仅验证能构建）
        run: ./gradlew assembleRelease --console=plain

      - name: 上传测试报告
        # 无论测试是否失败都上传，方便排查
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          retention-days: 7

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
