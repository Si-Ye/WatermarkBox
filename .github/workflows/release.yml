name: Release

# 打 tag（如 v1.4.1）时自动：
#   1. 跑测试
#   2. 用密钥签名构建 release APK
#   3. 创建 GitHub Release 并附上 APK
#
# 这样发布出去的程序包是「GitHub 服务器从公开代码编译」的，
# 任何人都能核对，不必依赖发布者的自觉。
on:
  push:
    tags:
      - 'v*'
  # 允许在 Actions 页面手动触发（用于补发失败的 Release）
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签，例如 v1.4.1'
        required: true

permissions:
  contents: write   # 创建 Release 需要写权限

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 跑单元测试
        run: ./gradlew testDebugUnitTest --console=plain

      # ---------------------------------------------------------------
      # 还原签名密钥
      #
      # 密钥以 base64 存在仓库 Secret 里（ANDROID_KEYSTORE_BASE64），
      # 密码存在另外三个 Secret 里。这样密钥本身不进版本库，
      # 只在构建时临时出现在 runner 的临时目录中（跑完即销毁）。
      # ---------------------------------------------------------------
      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 Secret: ANDROID_KEYSTORE_BASE64"
            echo "请参考 README 的「自动发布」一节完成配置。"
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          ls -l keystore/release.jks

      - name: 写入签名配置
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # 用 printf 而非 heredoc：YAML 里的缩进会被带进文件，
          # 虽然 Properties.load() 能容忍前导空格，但没必要留这种不确定。
          printf 'storeFile=keystore/release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          echo "已写入 keystore.properties"
          # 只打印键名，绝不回显密码值
          cut -d= -f1 keystore.properties

      - name: 构建 Release APK
        run: ./gradlew assembleRelease --console=plain

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: 确认产物
        run: |
          ls -lh app/build/outputs/apk/release/
          ls -lh app/build/outputs/apk/debug/

      - name: 生成校验值
        id: checksums
        run: |
          cd app/build/outputs/apk
          # 产出形如 "abc123  filename.apk" 的清单，供下载者核对
          {
            echo "checksums<<EOF"
            sha256sum release/*.apk debug/*.apk | sed 's|release/||; s|debug/||'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 创建 Release 并上传 APK
        uses: softprops/action-gh-release@v2
        with:
          # 手动触发时用输入的 tag，否则用推送的 tag
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: 水印盒 ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 水印盒 ${{ github.event.inputs.tag || github.ref_name }}

            轻量 Android 图片水印工具，支持实时预览、批量处理与 DCT 频域隐藏水印溯源。

            ### 下载

            | 文件 | 说明 |
            |---|---|
            | `app-release.apk` | **推荐**，正式包 |
            | `app-debug.apk` | 调试用，含额外日志，体积大 |

            > **注意**：两个包签名不同。装过其中一个后换装另一个，需先卸载（应用数据会丢失）。

            ### 校验值（SHA-256）

            ```
            ${{ steps.checksums.outputs.checksums }}
            ```

            ### 系统要求

            Android 8.0（API 26）及以上
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
