name: Release

# 打 tag（如 v1.4.1）时自动：
#   1. 跑测试
#   2. 用密钥签名构建 release APK
#   3. 创建 GitHub Release 并附上 APK
#
# 这样发布出去的程序包是「GitHub 服务器从公开代码编译」的，
# 任何人都能核对，不必依赖发布者的自觉。
on:
  push:
    tags:
      - 'v*'
  # 允许在 Actions 页面手动触发（用于补发失败的 Release）
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签，例如 v1.4.1'
        required: true

permissions:
  contents: write   # 创建 Release 需要写权限

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 跑单元测试
        run: ./gradlew testDebugUnitTest --console=plain

      # ---------------------------------------------------------------
      # 还原签名密钥
      #
      # 密钥以 base64 存在仓库 Secret 里（ANDROID_KEYSTORE_BASE64），
      # 密码存在另外三个 Secret 里。这样密钥本身不进版本库，
      # 只在构建时临时出现在 runner 的临时目录中（跑完即销毁）。
      # ---------------------------------------------------------------
      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 Secret: ANDROID_KEYSTORE_BASE64"
            echo "请参考 README 的「自动发布」一节完成配置。"
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          ls -l keystore/release.jks

      - name: 写入签名配置
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # 用 printf 而非 heredoc：YAML 里的缩进会被带进文件，
          # 虽然 Properties.load() 能容忍前导空格，但没必要留这种不确定。
          printf 'storeFile=keystore/release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          echo "已写入 keystore.properties"
          # 只打印键名，绝不回显密码值
          cut -d= -f1 keystore.properties
      - name: 构建 Release APK
        run: ./gradlew assembleRelease --console=plain

      # 发布前必须确认这个包**真的能装**。
      #
      # 历史教训：出现过「构建成功但缺 AndroidManifest.xml / resources.arsc」
      # 的产物 —— 那种包发出去等于给用户发了块砖头，而且 CI 是绿的。
      # 这一步在**改名前**校验，并强制要求签名块存在。
      - name: 校验 Release 包完整性（含签名）
        run: python3 tools/check_apk_integrity.py --require-signature app/build/outputs/apk/release/app-release.apk


      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: 确认产物
        run: |
          ls -lh app/build/outputs/apk/release/
          ls -lh app/build/outputs/apk/debug/

      # 把 Gradle 的默认产物名（app-release.apk / app-debug.apk）
      # 改成带项目名与版本号的名字。
      #
      # 为什么必须在 CI 里改名：
      # - 用户下载后文件名形如 `app-release.apk`，无法辨认版本，
      #   多次下载会互相覆盖，也难以确认自己装的是哪一版。
      # - 应用内「检查更新」在挑选下载附件时，会优先匹配文件名带
      #   `release` 的那个；名字里含版本号让这一判断更可靠。
      - name: 重命名产物
        id: rename
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd app/build/outputs/apk
          mv release/app-release.apk "release/WatermarkBox-${VERSION}-release.apk"
          mv debug/app-debug.apk "debug/WatermarkBox-${VERSION}-debug.apk"
          ls -lh release/ debug/
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: 生成校验值
        id: checksums
        run: |
          cd app/build/outputs/apk
          # 产出形如 "abc123  filename.apk" 的清单，供下载者核对
          {
            echo "checksums<<EOF"
            sha256sum release/*.apk debug/*.apk | sed 's|release/||; s|debug/||'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # 生成 Release 正文文件（release_body.md）。
      #
      # 版本说明**手写在仓库里**而不是由 CI 从 commit 拼凑，
      # 这样能写清「新增 / 修复 / 优化」三类信息 —— 用户最关心的部分。
      #
      # ## 为什么写文件而不是 GITHUB_OUTPUT（踩坑记录）
      #
      # 起初把正文塞进 `steps.<id>.outputs.body` 再用 `body:` 传给 action，
      # 结果 **Release 正文始终是旧内容**：多行输出经 GITHUB_OUTPUT 传递时
      # 容易在定界符/转义上出问题，且出错时不报错、静默用了空值。
      #
      # 改用 action 官方的 `body_path` 参数直接读文件后正常。
      # 少一层变量传递，也就少一类难查的坑。
      #
      # 找不到说明文件时不让构建失败，而是退回到通用内容并在日志里告警：
      # 发版不该因为漏写文档而卡住（APK 已经构建好了）。
      - name: 生成 Release 正文
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILE="docs/releases/${TAG}.md"
          BODY="release_body.md"

          if [ -f "$FILE" ]; then
            echo "找到版本说明：$FILE"
            cat "$FILE" > "$BODY"
          else
            echo "::warning::未找到 $FILE，将使用通用说明。请补充该版本的更新内容。"
            {
              echo "## 水印盒 ${TAG}"
              echo ""
              echo "轻量 Android 图片水印工具，支持实时预览、批量处理与 DCT 频域隐藏水印溯源。"
              echo ""
              echo "### 📦 下载"
              echo ""
              echo "| 文件 | 说明 |"
              echo "|---|---|"
              echo "| \`WatermarkBox-${TAG#v}-release.apk\` | **推荐**，正式包 |"
              echo "| \`WatermarkBox-${TAG#v}-debug.apk\` | 调试用，含额外日志 |"
              echo ""
              echo "### 系统要求"
              echo ""
              echo "Android 8.0（API 26）及以上"
            } > "$BODY"
          fi

          # 无论走哪个分支，都追加校验值（只有构建后才知道）
          {
            echo ""
            echo "### 校验值（SHA-256）"
            echo ""
            echo '```'
            echo "${{ steps.checksums.outputs.checksums }}"
            echo '```'
          } >> "$BODY"

          echo "正文文件已生成，共 $(wc -l < "$BODY") 行"
          echo "--- 前 12 行预览 ---"
          head -12 "$BODY"

      - name: 创建 Release 并上传 APK
        uses: softprops/action-gh-release@v2
        with:
          # 手动触发时用输入的 tag，否则用推送的 tag
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: 水印盒 ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          # 关掉 GitHub 自动生成的 "What's Changed"：
          # 它是从 commit 标题拼的（如「ci: 修正 Secret 名称」），
          # 对用户没有意义，反而稀释了正文里真正的更新内容。
          generate_release_notes: false
          # 正文初值也用 body_path：见「生成 Release 正文」步骤的注释。
          body_path: release_body.md
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk

      # 强制把正文写进 Release。
      #
      # ## 为什么还要单独来这一步（踩坑记录）
      #
      # 上面 action 的 `body_path` 只在**新建** Release 时生效。
      # 如果 tag 对应的 Release 已经存在（比如重打 tag 复用旧 Release），
      # action 会更新附件、但**不会覆盖正文** —— 表现是正文一直停留在旧内容，
      # 而 action 日志里对 body 只字不提，非常难查。
      #
      # `gh release edit --notes-file` 是「编辑已存在 Release」的明确命令，
      # 无论 Release 是新建还是复用，都会用文件内容覆盖正文。
      # gh CLI 预装在 GitHub Runner 上，GITHUB_TOKEN 也是自动提供的。
      - name: 更新 Release 正文
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "用 release_body.md 覆盖 ${TAG} 的正文"
          gh release edit "$TAG" --notes-file release_body.md
          echo "完成。正文长度：$(wc -c < release_body.md) 字节"
