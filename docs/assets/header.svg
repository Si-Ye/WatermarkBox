<?xml version="1.0" encoding="UTF-8"?>
<!--
  水印盒 WatermarkBox — README 头部横幅
  ────────────────────────────────────────────────────────────
  尺寸：1200 × 300

  ## 布局约束（改文案前请先量宽度）

  各元素的横向占用（x = 起点，w = 实测宽度）：

    图标      x= 56 .. 188     132px 见方
    主标题    x=216 .. 402     「水印盒」62px → 宽 186
    英文名    x=414 .. 676     「WatermarkBox」38px → 宽 262
    定位语    x=218 .. 641     「一个安静、克制的…」21px → 宽 423
    标签组    x=218 .. 638     三个胶囊，每个 132 + 12 间距

  ⚠️ 中文全角字符宽度 ≈ 字号（1:1），拉丁字母约 0.55 倍。
  「水印盒」3 字 @62px ≈ 186px 宽 —— 不是 140px。
  改文案后必须重新量一遍，否则就会重叠（曾因此重叠 46px）。

  设计说明：
  - 背景：品牌深蓝 #1A237E → #283593 斜向渐变，右侧叠琥珀色光晕
  - 图标：复刻 branding/ic_launcher.svg 的「盒子 + 水滴」
  - 斜纹：45° 细线，暗示「平铺水印」这个核心能力
-->
<svg width="1200" height="300" viewBox="0 0 1200 300"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1A237E"/>
      <stop offset="100%" stop-color="#283593"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#FF6F00" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#FF6F00" stop-opacity="0"/>
    </radialGradient>

    <pattern id="stripe" width="18" height="18"
             patternUnits="userSpaceOnUse"
             patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="18"
            stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="5"/>
    </pattern>
    <linearGradient id="icbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#8B5CF6"/>
      <stop offset="52%"  stop-color="#4358F5"/>
      <stop offset="100%" stop-color="#22C8F0"/>
    </linearGradient>

    <radialGradient id="icgloss" cx="0.26" cy="0.16" r="0.72">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="60%"  stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="icdrop" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0%"   stop-color="#F2FDFF"/>
      <stop offset="45%"  stop-color="#9CE9F8"/>
      <stop offset="100%" stop-color="#2FB4DC"/>
    </linearGradient>

  </defs>

  <!-- ============ 背景 ============ -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#stripe)"/>
  <circle cx="1080" cy="40" r="260" fill="url(#glow)"/>
  <circle cx="1010" cy="250" r="180" fill="url(#glow)"/>

  <!-- ============ 左侧图标（目标框 56..188 × 84..216，132×132）============ -->
  <!-- ⚠️ 这里的平移必须写**目标框的中心** (122, 150)，不能写左上角 (56, 84)：
       图形坐标系以中心为原点，坐标 = 母版 1024 画布减 512（框是 -512..+512，×0.129 = ±66）。
       写左上角的话整个图标会被画到画布左上角、左边直接裁掉一半。

  2026-10-28 换成新图标（母版 branding/ic_launcher.png，GPT-Image2 生成）：
  紫→蓝渐变圆角方 + 白色相框 + 山形 + 青色水滴。
  这里是**矢量复刻** —— 不用 <image> 引外部 PNG，GitHub 会剥掉 SVG 里的外链。
  坐标直接取自母版：相框 156..866 / 196..880，山与水滴同母版比例。 -->
  <g transform="translate(122, 150) scale(0.129)">
    <rect x="-512" y="-512" width="1024" height="1024" rx="200" fill="url(#icbg)"/>
    <rect x="-512" y="-512" width="1024" height="1024" rx="200" fill="url(#icgloss)"/>

    <!-- 相框：外圈圆角矩形减内圈（奇偶填充），线宽与母版一致 -->
    <path d="M -268 -316 L 266 -316 A 88 88 0 0 1 354 -228 L 354 280
             A 88 88 0 0 1 266 368 L -268 368
             A 88 88 0 0 1 -356 280 L -356 -228
             A 88 88 0 0 1 -268 -316 Z
             M -252 -250 L 250 -250 A 40 40 0 0 1 290 -210 L 290 270
             A 40 40 0 0 1 250 310 L -252 310
             A 40 40 0 0 1 -292 270 L -292 -210
             A 40 40 0 0 1 -252 -250 Z"
          fill="#FFFFFF" fill-opacity="0.97" fill-rule="evenodd"/>

    <!-- 山形：小峰 + 主峰，底边压到相框内沿 -->
    <path d="M -286 312 L -196 238 L -92 118 L 2 196 L 140 22 L 250 140 L 268 312 Z"
          fill="#EDF2FF" fill-opacity="0.94"/>

    <!-- 青色水滴（右下角压在相框边上，与母版同位置） -->
    <path d="M 306 44
             C 205 142 166 192 166 250
             C 166 330 228 382 306 382
             C 384 382 446 330 446 250
             C 446 192 407 142 306 44 Z"
          fill="url(#icdrop)" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="7"/>
    <ellipse cx="252" cy="286" rx="27" ry="36"
             fill="#FFFFFF" fill-opacity="0.5" transform="rotate(-18 262 288)"/>
  </g>

  <!-- ============ 文字区 ============ -->
  <g font-family="'Noto Sans CJK SC', 'Source Han Sans SC', 'PingFang SC',
                  'Microsoft YaHei', 'Hiragino Sans GB',
                  'Helvetica Neue', Arial, sans-serif">

    <!-- 主标题「水印盒」：216..402（62px，宽 186）-->
    <text x="216" y="140" font-size="62" font-weight="700"
          fill="#FFFFFF" letter-spacing="1">水印盒</text>

    <!-- 英文名：414..676（38px，宽 262），与主标题留 12px 间隙 -->
    <text x="414" y="140" font-size="38" font-weight="300"
          fill="#9FA8DA" letter-spacing="2">WatermarkBox</text>

    <!-- 一句话定位：218..641（21px，宽 423）-->
    <text x="218" y="192" font-size="21" fill="#C5CAE9"
          letter-spacing="0.5">一个安静、克制的 Android 图片水印工具</text>

    <!-- 特性标签：三个等宽 132px 的胶囊，间隔 12px ——
         文案必须都是**四个字**，否则字数少的那个在框里会显得空、看着像错位 -->
    <g font-size="17">
      <rect x="218" y="216" width="132" height="38" rx="19"
            fill="#FFFFFF" fill-opacity="0.12"
            stroke="#FFFFFF" stroke-opacity="0.24"/>
      <text x="284" y="241" fill="#E8EAF6" text-anchor="middle">实时预览</text>
      <rect x="362" y="216" width="132" height="38" rx="19"
            fill="#FF6F00" fill-opacity="0.18"
            stroke="#FF6F00" stroke-opacity="0.55"/>
      <text x="428" y="241" fill="#FFCC80" text-anchor="middle">隐藏水印</text>
      <rect x="506" y="216" width="132" height="38" rx="19"
            fill="#FFFFFF" fill-opacity="0.12"
            stroke="#FFFFFF" stroke-opacity="0.24"/>
      <text x="572" y="241" fill="#E8EAF6" text-anchor="middle">不上传图</text>
    </g>

  </g>
</svg>