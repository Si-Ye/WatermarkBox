<?xml version="1.0" encoding="UTF-8"?>
<!--
  水印盒 WatermarkBox — 应用图标（单色版）
  ────────────────────────────────────────────────────────────
  用途：Android 13+ 主题图标（Monochrome / Themed Icon）
  画布：1024 × 1024
  颜色：仅用单一前景色（#000000）。系统会将其作为 alpha 蒙版，
        按用户主题重新上色，因此这里**不含背景、不含第二色**。
  安全区：内容控制在 66/108 ≈ 61% 居中区域内
  要求：形状必须实心可辨（描边在蒙版下会变细，故加粗）
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024"
     xmlns="http://www.w3.org/2000/svg">

  <g transform="translate(512, 512)">

    <!-- 盒子盖 -->
    <rect x="-240" y="-216" width="480" height="92" rx="28" fill="#000000"/>

    <!-- 盒子主体（实心描边，蒙版下用粗线保证可辨） -->
    <path d="M -220 -92
             L -220 176
             Q -220 232 -164 232
             L 164 232
             Q 220 232 220 176
             L 220 -92
             Z"
          fill="none"
          stroke="#000000"
          stroke-width="58"
          stroke-linejoin="round"
          stroke-linecap="round"/>

    <!-- 水滴（实心，蒙版下的视觉重心） -->
    <path d="M 0 -56
             C -86 26 -120 68 -120 118
             C -120 186 -66 230 0 230
             C 66 230 120 186 120 118
             C 120 68 86 26 0 -56
             Z"
          fill="#000000"/>

  </g>
</svg>