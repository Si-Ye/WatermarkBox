<?xml version="1.0" encoding="UTF-8"?>
<!--
  水印盒 WatermarkBox — 应用图标（彩色版）
  ────────────────────────────────────────────────────────────
  画布：1024 × 1024
  品牌色：深蓝 #1A237E（背景，不透明）
  辅助色：琥珀 #FF6F00（水滴）
  图形：盒子 + 水滴，体现「水印盒」

  安全区：内容控制在 66/108 ≈ 61% 的居中区域内
         → 1024 × 0.61 ≈ 625，即中心约 625×625 范围内
         → 坐标范围约 [200, 824]
  缩放性：轮廓粗犷、无细节，48px 下依然可辨
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024"
     xmlns="http://www.w3.org/2000/svg">

  <!-- ============ 背景：深蓝实色，铺满画布 ============ -->
  <rect x="0" y="0" width="1024" height="1024" fill="#1A237E"/>

  <!-- ============ 图形主体（居中，位于安全区内）============ -->
  <g transform="translate(512, 512)">

    <!-- 盒子盖（顶部横条） -->
    <rect x="-240" y="-216" width="480" height="84" rx="26"
          fill="#FFFFFF" opacity="0.95"/>

    <!-- 盒子主体（白色粗描边方框） -->
    <path d="M -220 -100
             L -220 180
             Q -220 228 -172 228
             L 172 228
             Q 220 228 220 180
             L 220 -100
             Z"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="44"
          stroke-linejoin="round"
          stroke-linecap="round"/>

    <!-- 水滴（盒内，琥珀色） -->
    <path d="M 0 -50
             C -88 28 -124 70 -124 122
             C -124 190 -68 234 0 234
             C 68 234 124 190 124 122
             C 124 70 88 28 0 -50
             Z"
          fill="#FF6F00"/>

    <!-- 水滴高光 -->
    <circle cx="-44" cy="126" r="28" fill="#FFFFFF" opacity="0.42"/>

    <!-- 盒内两侧短横线（暗示水印印痕） -->
    <rect x="-190" y="14" width="48" height="20" rx="10"
          fill="#FFFFFF" opacity="0.55"/>
    <rect x="142" y="14" width="48" height="20" rx="10"
          fill="#FFFFFF" opacity="0.55"/>

  </g>
</svg>
